name: honeypotshelf

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    # Stamps the built image with the commit it came from (app.core.version,
    # shown on the Settings page) — set GIT_COMMIT in the shell/`.env` before
    # building, e.g. `GIT_COMMIT=$(git rev-parse HEAD) docker compose build`;
    # scripts/upgrade.sh does this automatically. Defaults to "unknown".
    #
    # CACHE_BUST forces the Dockerfile's NetBird/wireguard-tools layers to
    # actually re-fetch the latest release/package instead of reusing a
    # stale cached layer forever — see the Dockerfile's own comment there
    # for why those two specifically always track latest. Set it to
    # anything that changes between builds (scripts/upgrade.sh uses the
    # current date); a plain `docker compose build` with nothing passed
    # just keeps Docker's normal caching for that layer, same as any
    # other unpinned `RUN apt-get install` would.
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      CACHE_BUST: ${CACHE_BUST:-unknown}
  image: honeypotshelf:local
  env_file:
    - .env
  environment:
    # Container timezone — affects log timestamps and any local-time
    # formatting; the app and DB both store timestamps as UTC internally
    # regardless of this. Set TZ in .env (e.g. "Europe/Prague"); defaults
    # to UTC if unset. Deliberately global, not per-schedule — see
    # wiki/Architecture.md.
    TZ: ${TZ:-UTC}
  restart: unless-stopped

services:
  db:
    # Pinned to an exact patch version on purpose — the floating "18" tag
    # would silently pull newer minor releases on a rebuild. Bump this
    # deliberately (and re-test) rather than letting it happen implicitly.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    # Tuning knobs, active from the very first `docker compose up` — sized
    # for a fleet up to roughly 100 honeypots while staying RAM-conscious
    # (well under Postgres' own stock "assume a big dedicated box"
    # numbers), with autovacuum scale factors lowered so it keeps up with
    # this app's nightly retention purges. Fully overridable via the same
    # .env vars for a bigger fleet/host — see wiki/Installation.md.
    # Ported from an identical debcontrol change.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "autovacuum_vacuum_scale_factor=${POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05}"
      - "-c"
      - "autovacuum_analyze_scale_factor=${POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02}"
    # Mounted at the parent directory, not .../data — as of the postgres:18
    # image, PGDATA defaults to a major-version-specific subdirectory it
    # manages itself (/var/lib/postgresql/18/docker), mirroring
    # pg_ctlcluster's layout. Mounting at .../data directly (the old
    # convention) leaves that subdirectory looking empty to a fresh 18.x
    # image even once initialized, and the image now refuses to start
    # rather than risk silently starting empty next to real data sitting
    # at the legacy path. See https://github.com/docker-library/postgres/pull/1259.
    volumes:
      - pg_data:/var/lib/postgresql
    # Not published to the host on purpose — the DB is only reachable from
    # the docker network. Uncomment for local psql access:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Same reasoning as the Postgres image above — pinned to an exact patch.
    image: redis:8.10.1
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Only ever read inside the container by the healthcheck below
      # ($${REDIS_PASSWORD}, resolved by the container's own shell at
      # healthcheck time) — the server itself gets its password from the
      # command-line arg, substituted by Compose from the host/.env value
      # at parse time, same as it always did.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-image
    ports:
      # Host port is configurable via APP_PORT in .env (default 8080); the
      # container always listens on 8080 internally. Published on all
      # interfaces by default (APP_BIND_ADDRESS, default 0.0.0.0), and
      # plain HTTP — this app is meant to sit behind a TLS-terminating
      # reverse proxy (the bundled `caddy` service from
      # docker-compose.caddy.yml, or your own; see the wiki), but nothing
      # here restricts direct access to loopback. If you don't want this
      # port reachable from outside this host, set
      # APP_BIND_ADDRESS=127.0.0.1 in .env (no compose edit needed) or
      # block the port at the firewall instead. A reverse proxy running as
      # its own container should join this compose project's network
      # instead of going through the published port at all.
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    # Uncomment to point LOGO_SOURCE/FAVICON_SOURCE (in .env) at a local
    # file — e.g. LOGO_SOURCE=/app/branding/logo.svg — rather than a URL.
    # See wiki/Installation.md#custom-logo--favicon.
    # volumes:
    #   - ./branding:/app/branding:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Executes background tasks (SSH connects, facts/package refreshes, apt
  # runs, power commands, scheduled-task fan-out). Safe to scale to several
  # replicas — every task is idempotent enough for that, and Redis hands each
  # message to exactly one worker.
  #
  # --concurrency=10 keeps the previous queue's ceiling of 10 jobs in flight.
  # Each concurrency slot is a forked child process, which rebuilds its own DB
  # engine after the fork — see app/tasks/celery_app.py for why that matters.
  # Only a handful of daily housekeeping jobs run here (see that module) —
  # a low concurrency is plenty; raise it only if event volume/company count
  # grows enough to make the daily sweeps slow.
  worker:
    <<: *app-image
    command:
      ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Overrides the image's own HEALTHCHECK (curls web's :8080/healthz) —
    # worker never listens on that port at all, so it always failed here
    # regardless of whether Celery itself was actually fine, permanently
    # showing "unhealthy" no matter what. A plain liveness check (is the
    # main process still running) instead — no broker round trip, so a
    # slow/congested broker can't make this flap on its own; that's what
    # Celery's own monitoring (Flower, `celery inspect`) is for, not a
    # container healthcheck.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys\nexcl={os.getpid(),os.getppid()}\nfound=False\nfor p in os.listdir('/proc'):\n if not p.isdigit() or int(p) in excl: continue\n try: data=open(f'/proc/{p}/cmdline','rb').read()\n except OSError: continue\n if b'worker' in data: found=True; break\nsys.exit(0 if found else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The periodic scheduler: it runs no work itself, it only publishes the
  # beat_schedule entries (fleet sweeps, the per-minute scheduled-task tick,
  # the daily snapshot/purge sweeps) onto the queue for `worker` to pick up.
  #
  # EXACTLY ONE beat process must ever run. Do not `docker compose up
  # --scale beat=N` — every replica would publish the same schedule, so each
  # daily purge/snapshot and every sweep would fire N times.
  #
  # It reads the four interval settings (reachability/facts/monitoring/
  # OpenCanary-log-poll — Settings → Checks & retention, database-backed)
  # once at startup, so restart this service after changing any of them.
  beat:
    <<: *app-image
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Same fix as worker's own healthcheck above, and the same reasoning —
    # beat never listens on :8080 either. No broker-RPC equivalent to
    # `celery inspect ping` exists for beat (it only ever publishes,
    # nothing answers on its behalf), so this is a plain liveness check
    # too - not a claim that its schedule is actually firing correctly.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys\nexcl={os.getpid(),os.getppid()}\nfound=False\nfor p in os.listdir('/proc'):\n if not p.isdigit() or int(p) in excl: continue\n try: data=open(f'/proc/{p}/cmdline','rb').read()\n except OSError: continue\n if b'beat' in data: found=True; break\nsys.exit(0 if found else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pg_data:
  redis_data:

<span
  id="honeypot-status"
  hx-get="/honeypots/{{ honeypot.id }}/status-panel"
  hx-trigger="every 60s, live-status from:body"
  hx-swap="outerHTML settle:600ms"
>
  {% from "partials/_liveness.html" import liveness_badges %}
  {{ liveness_badges(request, honeypot) }}
  {% if honeypot.last_ping_at %}
    <span class="hint">({{ t(request, "partials.status.ssh_checked_at") }} {{ honeypot.last_ping_at | local_time('%Y-%m-%d %H:%M %Z') }})</span>
  {% endif %}
</span>

{# What GET /mac-vendors/search answers with: the options of the
   manufacturer drop-down (see partials/_mac_picker.html and combo.js).
   Picking one draws an address of theirs into the field above. #}
{% for name, prefixes in vendors %}
  <button type="button" class="combo-option" role="option" data-combo-value="{{ name }}"
          hx-get="/mac-vendors/generate" hx-vals='{{ {"vendor": name} | tojson }}'
          hx-target="#mac-address-field" hx-swap="innerHTML">
    <span>{{ name }}</span>
    <span class="hint">{{ t(request, "mac.prefix_count", count=prefixes) }}</span>
  </button>
{% else %}
  <p class="combo-empty hint">{{ t(request, "mac.no_vendor_match") }}</p>
{% endfor %}

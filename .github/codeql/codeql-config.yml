# Shared by every language in codeql.yml.
name: honeypot-shelf CodeQL config

# Third-party bundles vendored under app/web/static/ (htmx, xterm.js,
# Swagger UI) aren't this project's code: their findings can't be fixed here
# and would drown out the real ones. Alembic migrations are generated schema
# code with no request input; their `revision`/`down_revision` module
# globals are read by Alembic itself, which CodeQL reports as "unused".
paths-ignore:
  - app/web/static/js/htmx.min.js
  - app/web/static/js/xterm.min.js
  - app/web/static/js/xterm-addon-*.min.js
  - app/web/static/js/swagger-ui-*.js
  - alembic/versions

query-filters:
  # Models import each other only under `if TYPE_CHECKING:` (for the
  # relationship annotations); nothing is imported cyclically at runtime,
  # but this query doesn't recognise the guard.
  - exclude:
      id: py/unsafe-cyclic-import
  # ruff's F401 already enforces unused imports; the only ones left are
  # deliberate side-effect imports (registering every model), marked noqa.
  - exclude:
      id: py/unused-import

# Shared by every language in codeql.yml.
name: honeypot-shelf CodeQL config

# Third-party bundles vendored under app/web/static/ (htmx, xterm.js,
# Swagger UI) aren't this project's code: their findings can't be fixed here
# and would drown out the real ones. Alembic migrations are generated schema
# code with no request input; their `revision`/`down_revision` module
# globals are read by Alembic itself, which CodeQL reports as "unused".
paths-ignore:
  - app/web/static/js/htmx.min.js
  - app/web/static/js/xterm.min.js
  - app/web/static/js/xterm-addon-*.min.js
  - app/web/static/js/swagger-ui-*.js
  - alembic/versions
  # Jinja2 templates: the JavaScript extractor misreads `{{ ... }}`
  # expressions (`'%.0f' % x`, `items | length`) as JS and reports noise.
  # The strict CSP forbids inline scripts, so no real JS lives here anyway.
  - app/web/templates

query-filters:
  # Two models with a two-way relationship (User <-> Company, Honeypot <->
  # HoneypotEvent, ...) name each other in their annotations, so each imports
  # the other for type checking — at the bottom of the module, under
  # `if TYPE_CHECKING:`, never at runtime. That is still a "cycle" to this
  # note-level query; the one that matters, py/unsafe-cyclic-import (a class
  # used before its module finished importing), stays enabled and clean.
  - exclude:
      id: py/cyclic-import
  # ruff's F401 already enforces unused imports; the only ones left are
  # deliberate side-effect imports (registering every model), marked noqa.
  - exclude:
      id: py/unused-import

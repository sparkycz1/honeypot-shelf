name: CodeQL

# Static security analysis (SQL injection, XSS, SSRF, path traversal,
# unsafe deserialization, ...) — a different class of check from the
# `security` job in ci.yml, which only scans *dependencies* (pip-audit)
# for known CVEs, not this app's own code. Results show up under the
# repo's Security -> Code scanning tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches a new query/rule CodeQL itself ships, against code that
    # hasn't changed — a plain push/PR trigger alone would never re-scan
    # unchanged code once merged.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

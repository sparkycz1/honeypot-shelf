name: OpenSSF Scorecard

# Supply-chain security posture (branch protection, pinned dependencies,
# CI/CD config, ...) — a broader check than any single tool above, since
# it looks at how the *repo itself* is configured, not just this app's
# code or dependencies. Results feed the badge in README.md and show up
# under the repo's Security -> Code scanning tab (as "Scorecard").

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 3"

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

name: CI

# The exact gate the wiki's Development page documents
# (https://github.com/sparkycz1/honeypot-shelf/wiki/Development) for a
# local commit — ruff, mypy, the full test suite (in-memory SQLite, no
# real Postgres/Redis/Celery broker needed, see tests/conftest.py), and a
# single-alembic-head check — now also enforced here so a PR can't merge
# without it.
#
# No Postgres/Redis service containers: nothing in the gate needs a real
# one — pytest bootstraps its own dummy-but-valid env vars for
# `app.core.config.Settings` (see tests/conftest.py), so this workflow
# only needs to supply them itself for the one other step that imports
# Settings outside of pytest: a plain `alembic heads`. Deliberately scoped
# to just that step, not the whole job — setting INFORM_TOKEN at the
# workflow level would override tests/conftest.py's own dummy value for
# the whole pytest run too, and tests/test_inform.py hardcodes the exact
# token conftest.py sets and expects a real 401 against anything else.

on:
  push:
    branches: [main]
  pull_request:

# No job here needs to write anything — checkout, run tests/lint, read
# dependency metadata. Explicit top-level `read` (rather than relying on
# the repo-wide default) is what OpenSSF Scorecard's Token-Permissions
# check looks for — see https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.12.13"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app alembic tests

      - name: pytest
        run: uv run pytest -q

      - name: alembic — exactly one head
        env:
          # Only this step imports app.core.config.Settings outside of
          # pytest (which bootstraps its own matching values — see
          # tests/conftest.py) — dummy-but-valid, never real secrets.
          SECRET_KEY: ci-dummy-secret-key-not-a-real-value
          ENCRYPTION_KEY: IYH8EiMlmjkDacPXmvWQgDjTojLMD6GDwD8STyL1x0Y=
          POSTGRES_PASSWORD: ci-dummy-postgres-password
          REDIS_PASSWORD: ci-dummy-redis-password
          INFORM_TOKEN: ci-dummy-inform-token-not-a-real-value
        run: |
          heads="$(uv run alembic heads)"
          echo "$heads"
          count="$(grep -c '(head)' <<< "$heads")"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one alembic head, found $count — see https://github.com/sparkycz1/honeypot-shelf/wiki/Development."
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.12.13"

      - name: Install Python 3.14
        run: uv python install 3.14

      # Known-CVE scan of exactly what uv.lock would actually install —
      # separate from Dependabot (which watches for *newer* fixed versions
      # existing at all) in that this fails the build the moment a
      # vulnerable version is pinned, rather than waiting for a PR.
      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-dev -o requirements-audit.txt

      # `uvx` runs pip-audit in its own throwaway environment — never
      # touches uv.lock or this project's own venv.
      - name: pip-audit (known CVEs in locked dependencies)
        run: uvx pip-audit --strict -r requirements-audit.txt

  dependency-review:
    # Only meaningful on a PR — it diffs the base branch against the PR's
    # head to flag what a PR specifically *introduces* (a newly-added
    # vulnerable version, or a dependency under a license this project
    # can't use), which pip-audit's plain "scan uv.lock as it is right
    # now" doesn't distinguish from something already there before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0

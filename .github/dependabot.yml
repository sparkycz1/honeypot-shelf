version: 2

updates:
  # Python dependencies (pyproject.toml + the committed uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"

  # Base images pinned in Dockerfile, plus the image tags in
  # docker-compose.yml / docker-compose.caddy.yml (postgres, redis, caddy).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"

  # Every action pinned in .github/workflows/*.yml (ci.yml, codeql.yml,
  # scorecard.yml) — `directory: "/"` scans the whole workflows folder,
  # not just one file. Each `uses: owner/action@<sha>  # vX.Y.Z` is pinned
  # by commit SHA (see those workflows' own comments for why); Dependabot
  # already understands that exact pattern and opens a PR bumping both
  # the SHA and the trailing version comment together when a new release
  # ships — nothing extra to configure for that specifically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"

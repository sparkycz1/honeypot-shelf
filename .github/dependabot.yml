version: 2

updates:
  # Python dependencies (pyproject.toml + the committed uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"

  # Base images pinned in Dockerfile, plus the image tags in
  # docker-compose.yml / docker-compose.caddy.yml (postgres, redis, caddy).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"

  # Pinned action versions in .github/workflows/ci.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
